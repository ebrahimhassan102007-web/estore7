    <style>
        :root {
            --wood-bg: #fcedc9;
            --wood-dark: #814c1e;
            --wood-border: #5a2e0a;
            --gold: #ffb800;
            --gem: #00d2ff;
            --green: #5db836;
            --font-family: 'Tajawal', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-family);
            background: #5dbcf0;
            color: #333;
        }

        #game-canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
            z-index: 1;
        }

        /* HUD Overlay */
        #game-hud-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }

        #game-hud-overlay * {
            pointer-events: auto;
        }

        .hud-panel {
            background: linear-gradient(180deg, #fcedc9 0%, #e6cb9d 100%);
            border: 3px solid #814c1e;
            box-shadow: 0 6px 14px rgba(60, 30, 10, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.6);
            border-radius: 18px;
        }

        /* Floating Text Effects */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 18px;
            pointer-events: none;
            z-index: 300;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
            animation: floatUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.6); }
            20% { opacity: 1; transform: translateY(-15px) scale(1.15); }
            80% { opacity: 1; transform: translateY(-45px) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(0.85); }
        }

        /* Custom Scrollbar for Inventory & Shop */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #ab7138;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 500;
            pointer-events: none;
        }
        .toast-item {
            background: rgba(45, 25, 10, 0.88);
            border: 2px solid #ffbe44;
            color: #fff;
            padding: 8px 18px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            animation: toastPop 0.3s ease;
        }
        @keyframes toastPop {
            0% { opacity: 0; transform: translateY(-10px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Pulse Attention Animation */
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .pulse-btn {
            animation: gentlePulse 2.2s infinite ease-in-out;
        }
    </style>

    <script>
        /* ============================================================
           AUDIO SYNTHESIZER (Pure Web Audio API - Zero External Dependencies)
           ============================================================ */
        class FarmAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.bgmPlaying = false;
                this.bgmTimer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                if (!this.enabled && this.bgmTimer) {
                    clearTimeout(this.bgmTimer);
                    this.bgmPlaying = false;
                } else if (this.enabled && !this.bgmPlaying) {
                    this.playAmbience();
                }
                return this.enabled;
            }

            playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.15) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            sfxPlant() {
                this.playTone(320, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playTone(480, 'sine', 0.18, 0.2), 60);
            }

            sfxWater() {
                this.playTone(550, 'sine', 0.25, 0.15);
                setTimeout(() => this.playTone(420, 'sine', 0.2, 0.12), 90);
            }

            sfxHarvest() {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.18, 0.22), idx * 65);
                });
            }

            sfxCoin() {
                this.playTone(987.77, 'sine', 0.1, 0.2);
                setTimeout(() => this.playTone(1318.51, 'sine', 0.25, 0.25), 60);
            }

            sfxLevelUp() {
                const fanfare = [392, 523, 659, 783, 1046];
                fanfare.forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.35, 0.25), i * 110);
                });
            }

            sfxStep() {
                this.playTone(140 + Math.random() * 40, 'triangle', 0.06, 0.08);
            }

            playAmbience() {
                if (!this.enabled || this.bgmPlaying) return;
                this.bgmPlaying = true;
                const scheduleChirp = () => {
                    if (!this.enabled) return;
                    // Peaceful bird chirp
                    const baseFreq = 1600 + Math.random() * 400;
                    this.playTone(baseFreq, 'sine', 0.08, 0.04);
                    setTimeout(() => this.playTone(baseFreq + 350, 'sine', 0.09, 0.04), 100);
                    this.bgmTimer = setTimeout(scheduleChirp, 4000 + Math.random() * 6000);
                };
                scheduleChirp();
            }
        }
        const audio = new FarmAudio();

    <script>
        /* ============================================================
           THREE.JS 3D FARM ENGINE & PROCEDURAL CARTOON WORLD
           ============================================================ */
        class Farm3DWorld {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.clock = new THREE.Clock();

                // Character & Interaction
                this.player = null;
                this.farmerMesh = null;
                this.limbs = {};
                this.equippedTool = null;
                this.cameraTarget = new THREE.Vector3();
                this.cameraDistance = 9.5;
                this.cameraAngle = { yaw: 0.1, pitch: 0.35 };

                // World Entities
                this.plotObjects = [];
                this.animalObjects = [];
                this.clouds = [];
                this.windmillBlades = null;
                this.waterMesh = null;
                this.sunLight = null;
                this.hemiLight = null;

                // Input State
                this.keys = { up: false, down: false, left: false, right: false };
                this.joystickVector = { x: 0, y: 0 };
                this.isNearPlot = null;
                this.isNearAnimal = null;
                this.isNearBuilding = null;
            }

            init() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x7bc4f0);
                this.scene.fog = new THREE.FogExp2(0xa0daf7, 0.012);

                // Camera

            buildTerrain() {
                // Main Rolling Grass Plane
                const groundGeo = new THREE.PlaneGeometry(160, 160, 48, 48);
                // Subtle gentle undulating terrain
                const pos = groundGeo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const y = pos.getY(i);
                    const dist = Math.sqrt(x * x + y * y);
                    let zVal = 0;
                    if (dist > 18) {
                        zVal += Math.sin(x * 0.1) * 0.4 + Math.cos(y * 0.12) * 0.35;
                    }
                    pos.setZ(i, zVal);
                }
                groundGeo.computeVertexNormals();

                const groundMat = new THREE.MeshStandardMaterial({
                    color: 0x62b535,
                    roughness: 0.92,
                    metalness: 0.04
                });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Dirt Cobblestone Walkway
                const pathGeo = new THREE.PlaneGeometry(4.4, 48);
                const pathMat = new THREE.MeshStandardMaterial({
                    color: 0xd8a966,
                    roughness: 0.98
                });
                const path = new THREE.Mesh(pathGeo, pathMat);
                path.rotation.x = -Math.PI / 2;
                path.position.set(0, 0.02, 6);
                path.receiveShadow = true;
                this.scene.add(path);

                // Pretty Pond with Dock
                const pondGeo = new THREE.CylinderGeometry(6, 6.5, 0.5, 24);
                const pondMat = new THREE.MeshStandardMaterial({
                    color: 0x3b8bb8,
                    roughness: 0.15,

                });

            updatePlayer(delta) {
                if (!this.player) return;

                // Combine Keyboard & Touch Joystick input
                let moveX = this.joystickVector.x;
                let moveZ = -this.joystickVector.y; // invert Y for standard forward

                if (this.keys.up) moveZ -= 1;
                if (this.keys.down) moveZ += 1;
                if (this.keys.left) moveX -= 1;
                if (this.keys.right) moveX += 1;

                const inputLen = Math.hypot(moveX, moveZ);
                const isMoving = inputLen > 0.05;

                if (isMoving) {
                    const normX = moveX / (inputLen || 1);
                    const normZ = moveZ / (inputLen || 1);
                    const speed = 6.2;

                    this.player.position.x += normX * speed * delta;
                    this.player.position.z += normZ * speed * delta;

                    // Clamping inside farm boundaries
                    this.player.position.x = THREE.MathUtils.clamp(this.player.position.x, -28, 28);
                    this.player.position.z = THREE.MathUtils.clamp(this.player.position.z, -25, 28);

                    // Smooth Rotation towards move angle
                    const targetRotation = Math.atan2(normX, normZ);
                    this.farmerMesh.rotation.y = THREE.MathUtils.lerp(this.farmerMesh.rotation.y, targetRotation, 14 * delta);

                    // Leg & Arm Swing Walk Cycle
                    const t = this.clock.getElapsedTime() * 12;
                    this.limbs.leftLeg.rotation.x = Math.sin(t) * 0.65;
                    this.limbs.rightLeg.rotation.x = -Math.sin(t) * 0.65;
                    this.limbs.leftArm.rotation.x = -Math.sin(t) * 0.55;
                    this.limbs.rightArm.rotation.x = Math.sin(t) * 0.55;
                    this.limbs.body.position.y = Math.abs(Math.sin(t * 2)) * 0.08;

                    // Step Sound throttle
                    if (Math.sin(t) > 0.95 && Math.random() < 0.25) {
                        audio.sfxStep();
                    }
                } else {
                    // Idle Breathing Cycle
                    const t = this.clock.getElapsedTime() * 2.5;
                    this.limbs.leftLeg.rotation.x = THREE.MathUtils.lerp(this.limbs.leftLeg.rotation.x, 0, 10 * delta);
                    this.limbs.rightLeg.rotation.x = THREE.MathUtils.lerp(this.limbs.rightLeg.rotation.x, 0, 10 * delta);
                    this.limbs.leftArm.rotation.x = Math.sin(t) * 0.08;
                    this.limbs.rightArm.rotation.x = -Math.sin(t) * 0.08;
                    this.limbs.body.position.y = Math.sin(t) * 0.04;
                }

                // Update Third Person Camera
                const horizontalDistance = this.cameraDistance * Math.cos(this.cameraAngle.pitch);
                const verticalDistance = this.cameraDistance * Math.sin(this.cameraAngle.pitch);
                const camX = this.player.position.x + Math.sin(this.cameraAngle.yaw) * horizontalDistance;
                const camZ = this.player.position.z + Math.cos(this.cameraAngle.yaw) * horizontalDistance;
                const camY = this.player.position.y + 2.4 + verticalDistance;

                this.camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 8 * delta);
                this.cameraTarget.lerp(new THREE.Vector3(this.player.position.x, this.player.position.y + 1.6, this.player.position.z), 10 * delta);
                this.camera.lookAt(this.cameraTarget);

                // Update Windmill & Water
                if (this.windmillBlades) {
                    this.windmillBlades.rotation.z += delta * 0.8;
                }
                if (this.waterMesh) {
                    this.waterMesh.rotation.z = Math.sin(this.clock.getElapsedTime() * 0.5) * 0.02;
                }

                // Cloud motion
                this.clouds.forEach(c => {
                    c.position.x += c.userData.speed * delta;
                    if (c.position.x > 50) c.position.x = -50;
                });

                // Check Nearest Plot & Nearby Interactions
                this.checkInteractions();
            }

            checkInteractions() {
                let nearestPlot = null;
                let minDist = 3.2;

                this.plotObjects.forEach(plot => {
                    const d = this.player.position.distanceTo(plot.group.position);
                    if (d < minDist) {
                        minDist = d;
                        nearestPlot = plot;
                    }
                });

                this.isNearPlot = nearestPlot;

                // Check nearest animal
                let nearestAnimal = null;
                let minAnimDist = 3.6;
                this.animalObjects.forEach(anim => {
                    const d = this.player.position.distanceTo(anim.position);
                    if (d < minAnimDist) {
                        minAnimDist = d;
                        nearestAnimal = anim;
                    }
                });
                this.isNearAnimal = nearestAnimal;

                // Update Interactive Prompt on HUD
                const prompt = document.getElementById('interaction-prompt');
                const promptText = document.getElementById('prompt-text');
                const promptIcon = document.getElementById('prompt-icon');

                if (nearestPlot) {
                    prompt.style.opacity = '1';
                    if (nearestPlot.state === 'empty') {
                        promptIcon.textContent = '🌱';
                        promptText.textContent = 'اضغط لزراعة المحصول المختار';
                    } else if (nearestPlot.state === 'growing') {
                        if (!nearestPlot.watered) {
                            promptIcon.textContent = '💧';
                            promptText.textContent = 'اسقِ المحصول لتسريع نموه!';
                        } else {
                            promptIcon.textContent = '⏳';
                            const left = Math.max(0, Math.ceil((nearestPlot.readyAt - Date.now()) / 1000));
                            promptText.textContent = `ينمو... يتبقى ${left} ثواني`;
                        }
                    } else if (nearestPlot.state === 'ready') {
                        promptIcon.textContent = '✨';
                        promptText.textContent = 'المحصول ناضج! اضغط للحصاد';
                    }
                } else if (nearestAnimal) {
                    prompt.style.opacity = '1';
                    promptIcon.textContent = '🥛';
                    promptText.textContent = nearestAnimal.userData.hungry ? 'أطعم الحيوان لكسب الحليب!' : 'الحيوان سعيد ويأكل 🌾';
                } else {
                    prompt.style.opacity = '0';
                }
            }

            renderCropGrowth(plot) {
                const group = plot.cropGroup;
                // Clear old meshes
                while (group.children.length > 0) {
                    group.remove(group.children[0]);
                }

                if (plot.state === 'empty') return;

                const crop = CROPS_DEF[plot.cropType] || CROPS_DEF.wheat;
                const now = Date.now();
                const total = crop.growTime * 1000;
                const elapsed = Math.max(0, total - (plot.readyAt - now));
                const progress = Math.min(1, elapsed / total);

                if (progress >= 1) {
                    plot.state = 'ready';
                }

                // Stage 1: Sprout (Small green leaves)
                if (progress < 0.4) {
                    const sproutGeo = new THREE.ConeGeometry(0.12, 0.4, 5);
                    const sproutMat = new THREE.MeshStandardMaterial({ color: 0x76cc3f });
                    for (let s = 0; s < 4; s++) {
                        const sprout = new THREE.Mesh(sproutGeo, sproutMat);
                        sprout.position.set((s % 2 - 0.5) * 0.6, 0.2, (Math.floor(s / 2) - 0.5) * 0.6);
                        group.add(sprout);
                    }
                }
                // Stage 2: Growing
                else if (progress < 1) {
                    const stemGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.9, 6);
                    const stemMat = new THREE.MeshStandardMaterial({ color: 0x4aa62b });
                    for (let s = 0; s < 4; s++) {
                        const stem = new THREE.Mesh(stemGeo, stemMat);
                        stem.position.set((s % 2 - 0.5) * 0.7, 0.45, (Math.floor(s / 2) - 0.5) * 0.7);
                        group.add(stem);
                    }
                }
                // Stage 3: Fully Grown & Golden/Ripe
                else {
                    const ripeColor = plot.cropType === 'wheat' ? 0xffcc00 : (plot.cropType === 'corn' ? 0xf5a623 : 0xe03b24);
                    const ripeMat = new THREE.MeshStandardMaterial({ color: ripeColor, roughness: 0.6 });
                    const plantGeo = new THREE.CylinderGeometry(0.18, 0.08, 1.4, 7);

                    for (let s = 0; s < 5; s++) {
                        const plant = new THREE.Mesh(plantGeo, ripeMat);
                        const angle = (s / 5) * Math.PI * 2;
                        const dist = s === 4 ? 0 : 0.6;
                        plant.position.set(Math.cos(angle) * dist, 0.7, Math.sin(angle) * dist);
                        plant.castShadow = true;
                        group.add(plant);
                    }
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                const delta = this.clock.getDelta();

                // Update Player
                this.updatePlayer(delta);

                // Update Crop Growths
                this.plotObjects.forEach(plot => {
                    if (plot.state === 'growing' || plot.state === 'ready') {
                        this.renderCropGrowth(plot);
                    }
                });

                // Render Scene
                this.renderer.render(this.scene, this.camera);
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        const world = new Farm3DWorld();
        window.addEventListener('DOMContentLoaded', () => world.init());
    </script>

    <script>
        /* ============================================================
           FARM GAMEPLAY CONTROLLER & USER INTERFACE LOGIC
           ============================================================ */

        // Floating Text Helper
        function spawnFloatingText(text, x, y, color = '#ffd700') {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const item = document.createElement('div');
            item.className = 'toast-item';
            item.textContent = msg;
            container.appendChild(item);
            setTimeout(() => {
                item.style.opacity = '0';
                item.style.transform = 'translateY(-10px)';
                setTimeout(() => item.remove(), 300);
            }, 3000);
        }

        // Add XP & Coins with Level Up celebration
        function addXP(amount) {
            STATE.player.xp += amount;
            while (STATE.player.xp >= STATE.player.xpToNext) {
                STATE.player.xp -= STATE.player.xpToNext;
                STATE.player.level += 1;
                STATE.player.xpToNext = Math.round(STATE.player.xpToNext * 1.4);
                audio.sfxLevelUp();
                showToast(`🎉 مبروك! وصلت للمستوى ${STATE.player.level}!`);
                updateHUD();
            }
            updateHUD();
        }

        function addCoins(amount) {
            STATE.player.coins += amount;
            audio.sfxCoin();
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('hud-level-badge').textContent = STATE.player.level;
            document.getElementById('hud-coins').textContent = Number(STATE.player.coins).toLocaleString();
            document.getElementById('hud-gems').textContent = Number(STATE.player.gems).toLocaleString();
            
            const xpPct = Math.min(100, Math.round((STATE.player.xp / STATE.player.xpToNext) * 100));
            document.getElementById('hud-xp-bar').style.width = `${xpPct}%`;
            document.getElementById('hud-xp-text').textContent = `${STATE.player.xp} / ${STATE.player.xpToNext}`;

            renderMissions();
            renderHotbar();
        }

        // Hotbar Items Definition
        const HOTBAR_ITEMS = [
            { id: 'hoe', name: 'مجرفة', icon: '⛏️', type: 'tool' },
            { id: 'watering_can', name: 'مرشة ماء', icon: '🚰', type: 'tool' },
            { id: 'wheat_seed', name: 'بذور قمح', icon: '🌾', type: 'seed', cropKey: 'wheat' },
            { id: 'corn_seed', name: 'بذور ذرة', icon: '🌽', type: 'seed', cropKey: 'corn' },
            { id: 'carrot_seed', name: 'بذور جزر', icon: '🥕', type: 'seed', cropKey: 'carrot' },
            { id: 'tomato_seed', name: 'بذور طماطم', icon: '🍅', type: 'seed', cropKey: 'tomato' }
        ];

        function renderHotbar() {
            const container = document.getElementById('hotbar-slots');
            container.innerHTML = '';

            HOTBAR_ITEMS.forEach(item => {
                const slot = document.createElement('button');
                const isSelected = STATE.activeHotbar === item.id;
                slot.className = `w-12 h-12 rounded-xl flex flex-col items-center justify-center relative transition-transform ${
                    isSelected ? 'bg-amber-400 border-2 border-yellow-200 scale-105 shadow-md' : 'bg-amber-950/80 hover:bg-amber-900 border border-amber-700/60'
                }`;

                const count = item.type === 'seed' ? (STATE.inventory[item.id] || 0) : null;

                slot.innerHTML = `
                    <span class="text-2xl drop-shadow">${item.icon}</span>
                    ${count !== null ? `<span class="absolute bottom-0.5 right-1 text-[9px] font-black text-white bg-black/60 px-1 rounded-full">${count}</span>` : ''}
                `;

                slot.onclick = () => {
                    STATE.activeHotbar = item.id;
                    renderHotbar();
                };

                container.appendChild(slot);
            });
        }

        function performPrimaryAction() {
            const plot = world.isNearPlot;
            const animal = world.isNearAnimal;

            // 1. Plot Interactions
            if (plot) {
                // Harvest Ready Crop
                if (plot.state === 'ready') {
                    const crop = CROPS_DEF[plot.cropType];
                    const cropAmount = 2 + Math.floor(Math.random() * 2);
                    STATE.inventory[plot.cropType] = (STATE.inventory[plot.cropType] || 0) + cropAmount;
                    
                    audio.sfxHarvest();
                    addXP(crop.xp);
                    showToast(`🌾 تم حصاد ${cropAmount}x ${crop.name}!`);

                    // Reset plot
                    plot.state = 'empty';
                    plot.cropType = null;
                    plot.watered = false;
                    plot.bedMesh.material.color.setHex(0x774822);
                    world.renderCropGrowth(plot);

                    // Update Missions
                    trackMissionProgress('m2', 1);

                    // Visual Floating feedback
                    const rect = document.getElementById('btn-action-primary').getBoundingClientRect();
                    spawnFloatingText(`+${cropAmount} ${crop.name}!`, rect.left - 20, rect.top - 20, '#4ade80');
                    return;
                }

                // Water Growing Crop
                if (plot.state === 'growing' && !plot.watered) {
                    plot.watered = true;
                    plot.bedMesh.material.color.setHex(0x482910); // Wet dark soil
                    // Speed up ready time
                    plot.readyAt -= 5000;
                    audio.sfxWater();
                    showToast('💧 تم سقي المحصول، سينمو أسرع الآن!');
                    return;
                }

                // Plant Seed on Empty Soil
                if (plot.state === 'empty') {
                    const currentSelected = HOTBAR_ITEMS.find(i => i.id === STATE.activeHotbar);
                    if (!currentSelected || currentSelected.type !== 'seed') {
                        showToast('⚠️ اختر بذوراً من الشريط السفلي أولاً لزرعها!');
                        return;
                    }

                    const seedCount = STATE.inventory[currentSelected.id] || 0;
                    if (seedCount <= 0) {
                        showToast(`⚠️ نفدت ${currentSelected.name}! يمكنك شراء المزيد من المتجر 🏪`);
                        return;
                    }

                    // Consume seed
                    STATE.inventory[currentSelected.id] -= 1;
                    plot.state = 'growing';
                    plot.cropType = currentSelected.cropKey;
                    const crop = CROPS_DEF[currentSelected.cropKey];
                    plot.plantedAt = Date.now();
                    plot.readyAt = Date.now() + (crop.growTime * 1000);
                    plot.watered = false;

                    audio.sfxPlant();
                    showToast(`🌱 تم زراعة ${crop.name}!`);
                    world.renderCropGrowth(plot);
                    updateHUD();

                    // Update Missions
                    if (crop.id === 'wheat') trackMissionProgress('m1', 1);
                    return;
                }
            }

            // 2. Animal Interactions
            if (animal) {
                if (animal.userData.hungry) {
                    const feedCount = STATE.inventory.wheat || 0;
                    if (feedCount <= 0) {
                        showToast('⚠️ البقرة بحاجة إلى قمح 🌾 لإطعامها!');
                        return;
                    }
                    STATE.inventory.wheat -= 1;
                    animal.userData.hungry = false;
                    animal.userData.readyAt = Date.now() + 10000;
                    audio.sfxHarvest();
                    addXP(25);
                    STATE.inventory.milk = (STATE.inventory.milk || 0) + 1;
                    showToast('🥛 تم إطعام البقرة وحلب الحليب الطازج!');
                    trackMissionProgress('m3', 1);
                    updateHUD();
                } else {
                    showToast('🐄 البقرة سعيدة وشبعانة حالياً!');
                }
                return;
            }

            // Default
            audio.playTone(300, 'sine', 0.1, 0.1);
        }

        document.getElementById('btn-action-primary').addEventListener('click', performPrimaryAction);

        function trackMissionProgress(missionId, amount) {
            const m = STATE.missions.find(item => item.id === missionId);
            if (m && !m.done) {
                m.current += amount;
                if (m.current >= m.target) {
                    m.current = m.target;
                    m.done = true;
                    addCoins(m.reward);
                    addXP(40);
                    showToast(`🏆 أحسنت! أنجزت مهمة: ${m.title}`);
                }
                renderMissions();
            }
        }

        function renderMissions() {
            const list = document.getElementById('missions-list');
            if (!list) return;
            list.innerHTML = STATE.missions.map(m => `
                <div class="bg-amber-100/80 p-2 rounded-xl border border-amber-800/20 flex flex-col gap-1 ${m.done ? 'opacity-60 bg-emerald-100' : ''}">
                    <div class="flex items-center justify-between font-bold text-amber-950">
                        <span>${m.icon} ${m.title}</span>
                        <span>${m.done ? '✓' : `${m.current}/${m.target}`}</span>
                    </div>
                    <div class="w-full h-1.5 bg-amber-950/20 rounded-full overflow-hidden">
                        <div class="h-full bg-emerald-500 rounded-full" style="width: ${(m.current / m.target) * 100}%"></div>
                    </div>
                </div>
            `).join('');
        }

        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') world.keys.up = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') world.keys.down = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') world.keys.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') world.keys.right = true;
            if (e.code === 'Space') {
                e.preventDefault();
                performPrimaryAction();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') world.keys.up = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') world.keys.down = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') world.keys.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') world.keys.right = false;
        });

        // Touch Joystick implementation
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joyActive = false;
        let joyStart = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            joyActive = true;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            const touch = e.touches[0];
            const maxR = 45;
            const dx = touch.clientX - joyStart.x;
            const dy = touch.clientY - joyStart.y;
            const dist = Math.hypot(dx, dy);
            const clamped = Math.min(dist, maxR);
            const angle = Math.atan2(dy, dx);

            const knX = Math.cos(angle) * clamped;
            const knY = Math.sin(angle) * clamped;
            joystickKnob.style.transform = `translate(${knX}px, ${knY}px)`;

            world.joystickVector = {
                x: knX / maxR,
                y: -knY / maxR
            };
        }, { passive: true });

        window.addEventListener('touchend', () => {
            if (!joyActive) return;
            joyActive = false;
            joystickKnob.style.transform = 'translate(0px, 0px)';
            world.joystickVector = { x: 0, y: 0 };
        });

        // Touch drag to Orbit Camera around farm
        // ============================================================
        // TOUCH CAMERA: one finger = orbit, two fingers = pinch zoom
        // ============================================================
        let isOrbiting = false;
        let orbitPointerId = null;
        let lastTouchX = 0;
        let lastTouchY = 0;
        const activeTouches = new Map();
        let pinchStartDistance = 0;
        let pinchStartCameraDistance = world.cameraDistance;

        const touchDistance = () => {
            const points = [...activeTouches.values()];
            if (points.length < 2) return 0;
            const dx = points[0].x - points[1].x;
            const dy = points[0].y - points[1].y;
            return Math.hypot(dx, dy);
        };

        world.canvas.style.touchAction = 'none';

        world.canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'touch' || joyActive) return;

            activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
            world.canvas.setPointerCapture?.(e.pointerId);

            if (activeTouches.size === 1) {
                isOrbiting = true;
                orbitPointerId = e.pointerId;
                lastTouchX = e.clientX;
                lastTouchY = e.clientY;
            } else if (activeTouches.size === 2) {
                isOrbiting = false;
                pinchStartDistance = touchDistance();
                pinchStartCameraDistance = world.cameraDistance;
            }
        });

        world.canvas.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'touch' || !activeTouches.has(e.pointerId)) return;

            activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activeTouches.size >= 2) {
                const currentDistance = touchDistance();
                if (currentDistance > 0 && pinchStartDistance > 0) {
                    world.cameraDistance = THREE.MathUtils.clamp(
                        pinchStartCameraDistance * (pinchStartDistance / currentDistance),
                        4.5,
                        14.0
                    );
                }
                return;
            }

            if (isOrbiting && e.pointerId === orbitPointerId) {
                const dx = e.clientX - lastTouchX;
                const dy = e.clientY - lastTouchY;
                lastTouchX = e.clientX;
                lastTouchY = e.clientY;

                world.cameraAngle.yaw -= dx * 0.008;
                world.cameraAngle.pitch = THREE.MathUtils.clamp(
                    world.cameraAngle.pitch - dy * 0.004,
                    -0.05,
                    0.85
                );
            }
        });

        const endPointer = (e) => {
            if (!activeTouches.has(e.pointerId)) return;
            activeTouches.delete(e.pointerId);

            if (activeTouches.size === 1) {
                const [id, point] = [...activeTouches.entries()][0];
                orbitPointerId = id;
                lastTouchX = point.x;
                lastTouchY = point.y;
                isOrbiting = true;
                pinchStartDistance = 0;
            } else if (activeTouches.size === 0) {
                isOrbiting = false;
                orbitPointerId = null;
                pinchStartDistance = 0;
            }
        };

        world.canvas.addEventListener('pointerup', endPointer);
        world.canvas.addEventListener('pointercancel', endPointer);

        // Modals Management
        function openModal(id) {
            document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModals() {
            document.querySelectorAll('[id^="modal-"]').forEach(m => {
                m.classList.add('hidden');
                m.classList.remove('flex');
            });
        }

        document.querySelectorAll('.modal-close-btn').forEach(btn => btn.onclick = closeModals);

        document.getElementById('btn-open-shop').onclick = () => {
            renderShop('seeds');
            openModal('modal-shop');
        };

        document.getElementById('btn-open-orders').onclick = () => {
            renderOrdersModal();
            openModal('modal-orders');
        };

        document.getElementById('btn-open-inventory').onclick = () => {
            renderInventoryModal();
            openModal('modal-inventory');
        };

        document.getElementById('btn-camera-toggle').onclick = () => {
            world.cameraAngle.yaw += Math.PI / 2;
        };

        document.getElementById('btn-audio-toggle').onclick = (e) => {
            const on = audio.toggle();
            e.currentTarget.textContent = on ? '🔊' : '🔇';
            showToast(on ? 'تم تشغيل الصوتيات' : 'تم كتم الصوتيات');
        };

        document.getElementById('btn-toggle-missions').onclick = () => {
            document.getElementById('missions-board').classList.toggle('hidden');
        };

        // Shop Renderer
        function renderShop(category = 'seeds') {
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';

            if (category === 'seeds') {
                Object.values(CROPS_DEF).forEach(c => {
                    const itemCard = document.createElement('div');
                    itemCard.className = 'bg-white p-3 rounded-2xl border-2 border-amber-800/30 flex flex-col items-center text-center shadow-sm hover:border-amber-600 transition-all';
                    itemCard.innerHTML = `
                        <span class="text-4xl mb-1">${c.icon}</span>
                        <span class="font-extrabold text-amber-950 text-sm">${c.name}</span>
                        <span class="text-xs font-bold text-amber-700 mt-1">🪙 ${c.seedCost}</span>
                        <button class="mt-2 w-full py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs shadow">شراء</button>
                    `;
                    itemCard.querySelector('button').onclick = () => {
                        if (STATE.player.coins < c.seedCost) {
                            showToast('⚠️ لا تملك ذهباً كافياً!');
                            return;
                        }
                        STATE.player.coins -= c.seedCost;
                        const seedKey = `${c.id}_seed`;
                        STATE.inventory[seedKey] = (STATE.inventory[seedKey] || 0) + 1;
                        audio.sfxCoin();
                        showToast(`تم شراء بذور ${c.name}!`);
                        updateHUD();
                    };
                    container.appendChild(itemCard);
                });
            } else if (category === 'animals') {
                Object.values(ANIMALS_DEF).forEach(a => {
                    const itemCard = document.createElement('div');
                    itemCard.className = 'bg-white p-3 rounded-2xl border-2 border-amber-800/30 flex flex-col items-center text-center shadow-sm';
                    itemCard.innerHTML = `
                        <span class="text-4xl mb-1">${a.icon}</span>
                        <span class="font-extrabold text-amber-950 text-sm">${a.name}</span>
                        <span class="text-xs font-bold text-amber-700 mt-1">🪙 ${a.cost}</span>
                        <button class="mt-2 w-full py-1 rounded-lg bg-emerald-600 text-white font-black text-xs shadow">شراء</button>
                    `;
                    itemCard.querySelector('button').onclick = () => {
                        if (STATE.player.coins < a.cost) {
                            showToast('⚠️ لا تملك ذهباً كافياً!');
                            return;
                        }
                        STATE.player.coins -= a.cost;
                        audio.sfxCoin();
                        showToast(`تم شراء ${a.name} جديدة لمزرعتك!`);
                        updateHUD();
                    };
                    container.appendChild(itemCard);
                });
            } else {
                container.innerHTML = `<div class="col-span-3 text-center text-amber-900 font-bold py-8">المباني متاحة وقيد العمل في مزرعتك بالفعل! 🏡</div>`;
            }
        }

        document.querySelectorAll('.shop-tab-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.shop-tab-btn').forEach(b => {
                    b.className = 'shop-tab-btn flex-1 py-1.5 rounded-lg text-amber-900 hover:bg-amber-200';
                });
                e.currentTarget.className = 'shop-tab-btn flex-1 py-1.5 rounded-lg bg-amber-700 text-white';
                renderShop(e.currentTarget.dataset.tab);
            };
        });

        // Orders Board Renderer
        const SAMPLE_ORDERS = [
            { id: 'o1', customer: 'أحمد المزارع', icon: '👨‍🌾', item: 'wheat', itemName: 'قمح', count: 4, rewardCoins: 120, rewardXP: 45 },
            { id: 'o2', customer: 'سارة الخبازة', icon: '👩‍🍳', item: 'corn', itemName: 'ذرة', count: 2, rewardCoins: 140, rewardXP: 60 },
            { id: 'o3', customer: 'العم صالح', icon: '👴', item: 'milk', itemName: 'حليب', count: 1, rewardCoins: 100, rewardXP: 40 }
        ];

        function renderOrdersModal() {
            const container = document.getElementById('orders-list-container');
            container.innerHTML = SAMPLE_ORDERS.map(order => {
                const hasItem = (STATE.inventory[order.item] || 0) >= order.count;
                return `
                    <div class="bg-white p-3.5 rounded-2xl border-2 border-amber-800/30 flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-2.5">
                            <span class="text-3xl">${order.icon}</span>
                            <div class="flex flex-col text-right">
                                <span class="font-extrabold text-amber-950 text-sm">${order.customer}</span>
                                <span class="text-xs text-amber-800">مطلوب: ${order.count}x ${order.itemName} (تملك: ${STATE.inventory[order.item] || 0})</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="text-left text-xs font-black text-amber-900">
                                <div>🪙 +${order.rewardCoins}</div>
                                <div class="text-emerald-700">⭐ +${order.rewardXP}</div>
                            </div>
                            <button class="order-deliver-btn px-4 py-2 rounded-xl font-black text-xs text-white shadow ${
                                hasItem ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-gray-400 cursor-not-allowed'
                            }" data-id="${order.id}">تسليم</button>
                        </div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('.order-deliver-btn').forEach(btn => {
                btn.onclick = () => {
                    const o = SAMPLE_ORDERS.find(item => item.id === btn.dataset.id);
                    if (!o) return;
                    if ((STATE.inventory[o.item] || 0) < o.count) {
                        showToast('⚠️ ينقصك بعض المحصول لتسليم هذا الطلب!');
                        return;
                    }
                    STATE.inventory[o.item] -= o.count;
                    addCoins(o.rewardCoins);
                    addXP(o.rewardXP);
                    audio.sfxCoin();
                    showToast(`📦 تم إنجاز طلب ${o.customer}!`);
                    renderOrdersModal();
                    updateHUD();
                };
            });
        }

        // Inventory Modal Renderer
        function renderInventoryModal() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            let totalCount = 0;

            Object.entries(STATE.inventory).forEach(([key, count]) => {
                if (count <= 0) return;
                totalCount += count;
                const isSeed = key.endsWith('_seed');
                const cleanKey = isSeed ? key.replace('_seed', '') : key;
                const cropDef = CROPS_DEF[cleanKey];
                const animDef = Object.values(ANIMALS_DEF).find(a => a.product === key);
                
                const icon = isSeed ? '🌱' : (cropDef ? cropDef.icon : (animDef ? animDef.productIcon : '📦'));
                const name = isSeed ? `بذور ${cropDef?.name}` : (cropDef ? cropDef.name : (animDef ? animDef.productName : key));
                const price = cropDef ? Math.round(cropDef.sellPrice * 0.7) : 40;

                const card = document.createElement('div');
                card.className = 'bg-white p-2.5 rounded-2xl border-2 border-amber-800/30 flex flex-col items-center text-center shadow-sm relative group cursor-pointer hover:border-amber-600';
                card.innerHTML = `
                    <span class="text-3xl">${icon}</span>
                    <span class="font-bold text-xs text-amber-950 mt-1">${name}</span>
                    <span class="text-[11px] font-black text-amber-800 bg-amber-100 px-2 rounded-full mt-1">العدد: ${count}</span>
                    <button class="mt-2 w-full py-1 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-black text-[10px]">بيع بـ ${price}🪙</button>
                `;
                card.querySelector('button').onclick = (e) => {
                    e.stopPropagation();
                    STATE.inventory[key] -= 1;
                    addCoins(price);
                    showToast(`تم بيع 1x ${name} مقابل ${price} 🪙`);
                    renderInventoryModal();
                    updateHUD();
                };
                grid.appendChild(card);
            });

            if (totalCount === 0) {
                grid.innerHTML = `<div class="col-span-4 text-center py-10 text-amber-800 font-bold">الحقيبة فارغة تماماً! احصد محاصيلك لتخزينها هنا.</div>`;
            }
            document.getElementById('inv-capacity-indicator').textContent = `السعة: ${totalCount} / 50`;
        }

        // In-game Day/Night Clock Engine
        setInterval(() => {
            STATE.time.minutes += 10;
            if (STATE.time.minutes >= 60) {
                STATE.time.minutes = 0;
                STATE.time.hours += 1;
                if (STATE.time.hours >= 24) {
                    STATE.time.hours = 0;
                    STATE.time.day += 1;
                }
            }

            const hStr = STATE.time.hours.toString().padStart(2, '0');
            const mStr = STATE.time.minutes.toString().padStart(2, '0');
            const ampm = STATE.time.hours >= 12 ? 'PM' : 'AM';
            document.getElementById('hud-clock-time').textContent = `${hStr}:${mStr} ${ampm}`;
            document.getElementById('hud-season-day').textContent = `${STATE.time.season} • يوم ${STATE.time.day}`;

            // Adjust 3D Sky Color and Sun Angle for Day/Night Atmosphere
            if (world && world.scene && world.sunLight) {
                const hour = STATE.time.hours;
                if (hour >= 6 && hour < 17) {
                    // Day
                    world.scene.background.setHex(0x7bc4f0);
                    world.sunLight.intensity = 1.8;
                    world.hemiLight.intensity = 1.3;
                    document.getElementById('hud-weather-icon').textContent = '☀️';
                } else if (hour >= 17 && hour < 20) {
                    // Golden Sunset
                    world.scene.background.setHex(0xf59e42);
                    world.sunLight.intensity = 1.2;
                    world.hemiLight.color.setHex(0xffaa55);
                    document.getElementById('hud-weather-icon').textContent = '🌅';
                } else {
                    // Night
                    world.scene.background.setHex(0x132338);
                    world.sunLight.intensity = 0.4;
                    world.hemiLight.intensity = 0.5;
                    world.hemiLight.color.setHex(0x334466);
                    document.getElementById('hud-weather-icon').textContent = '🌙';
                }
            }
        }, 1200);

        // Boot Init
        window.addEventListener('load', () => {
            const fill = document.getElementById('loading-bar-fill');
            let progress = 15;
            const timer = setInterval(() => {
                progress += 28;
                fill.style.width = `${progress}%`;
                if (progress >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        const screen = document.getElementById('loading-screen');
                        screen.style.opacity = '0';
                        setTimeout(() => screen.remove(), 500);
                        showToast('🌾 مرحباً بك في مزرعتك ثلاثية الأبعاد!');
                        audio.playAmbience();
                    }, 350);
                }
            }, 100);

            updateHUD();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5dbcf0">
  <title>MY FARM 3D - World & Expansion</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/farm.css">
  <link rel="stylesheet" href="./css/hud.css">
  <link rel="stylesheet" href="./css/production.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #5dbcf0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
      touch-action: none;
      z-index: 2;
    }

    /* Floating Dynamic Interaction Prompt */
    #action-prompt {
      position: fixed;
      bottom: 112px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 20, 10, 0.94);
      border: 3px solid #ffbe44;
      border-radius: 24px;
      padding: 10px 22px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #action-prompt.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    #action-prompt .prompt-info {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    #action-prompt .prompt-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffd54f;
    }

    #action-prompt .prompt-desc {
      font-size: 12px;
      font-weight: 700;
      color: #e0e0e0;
    }

    #action-prompt .prompt-btn {
      background: linear-gradient(180deg, #79d63c 0%, #46961a 100%);
      border: 2px solid #fff;
      border-radius: 16px;
      color: #fff;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    #action-prompt .prompt-btn:active {
      transform: scale(0.92);
    }

    /* Modal Purchase Confirmation */
    #purchase-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      backdrop-filter: blur(5px);
    }

    #purchase-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: linear-gradient(180deg, #fcedc9 0%, #e6cb9d 100%);
      border: 4px solid #814c1e;
      border-radius: 24px;
      padding: 24px 20px;
      width: 90%;
      max-width: 330px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0,0,0,0.45);
    }

    .modal-card h3 {
      font-size: 19px;
      font-weight: 900;
      color: #5a2e0a;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 13px;
      font-weight: 700;
      color: #6a3e1b;
      margin-bottom: 16px;
    }

    .modal-card .price-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #743e18;
      border: 2px solid #ffbe44;
      padding: 6px 16px;
      border-radius: 999px;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 900;
      border-radius: 14px;
      border: 2px solid #fff;
      cursor: pointer;
    }

    .btn-confirm-buy {
      background: linear-gradient(180deg, #79d63c 0%, #46961a 100%);
      color: #fff;
    }

    .btn-cancel-buy {
      background: linear-gradient(180deg, #e53935 0%, #b71c1c 100%);
      color: #fff;
    }

    /* Floating Feedback Text */
    .floating-feedback {
      position: fixed;
      font-weight: 900;
      font-size: 20px;
      pointer-events: none;
      z-index: 3000;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      animation: floatUpAnim 1.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes floatUpAnim {
      0% { opacity: 0; transform: translateY(0) scale(0.7); }
      20% { opacity: 1; transform: translateY(-20px) scale(1.15); }
      80% { opacity: 1; transform: translateY(-60px) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(0.85); }
    }

    /* ============================================================
       شاشة التحميل — بوستر رسمي full-bleed + شريط تقدّم رفيع
       (البديل عن شاشة الإيموجي، ومطابق لهوية الخشب/الذهبي)
       ============================================================ */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: block;
      overflow: hidden;
      background: #1b2d16;
      color: #fff;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #loading-screen.fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #loading-screen .boot-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      /* لا نمنع الانتظار: الصورة تُخفى إن فشلت فيظهر الغامق فقط */
      animation: bootArtIn 0.55s ease both;
    }

    #loading-screen .boot-scrim {
      position: absolute;
      inset: auto 0 0 0;
      height: min(46vh, 300px);
      background: linear-gradient(180deg, rgba(10, 18, 8, 0) 0%, rgba(10, 18, 8, 0.72) 58%, rgba(6, 12, 5, 0.92) 100%);
      pointer-events: none;
    }

    #loading-screen .boot-panel {
      position: absolute;
      inset: auto max(14px, env(safe-area-inset-right)) max(26px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      text-align: center;
      padding: 14px 16px 16px;
      border-radius: 20px;
      border: 3px solid #814c1e;
      outline: 1px solid rgba(252, 237, 201, 0.45);
      background: linear-gradient(180deg, rgba(66, 38, 14, 0.82) 0%, rgba(37, 22, 8, 0.88) 100%);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
      max-width: 520px;
      margin-inline: auto;
    }

    #loading-screen .boot-title {
      margin: 0 0 2px;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fcedc9;
      text-shadow: 0 2px 0 #4a280c, 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    #loading-screen .boot-subtitle {
      margin: 0 0 12px;
      font-size: clamp(11px, 3.2vw, 13px);
      font-weight: 700;
      color: #ffbe44;
      letter-spacing: 3px;
    }

    /* شريط رفيع كما في المواصفات */
    #loading-screen .boot-track {
      position: relative;
      width: 100%;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(252, 237, 201, 0.35);
    }

    #loading-screen .boot-fill {
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      width: 8%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffbe44 0%, #ffe9a8 55%, #ffbe44 100%);
      transition: width 0.22s ease;
    }

    #loading-screen .boot-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(252, 237, 201, 0.86);
    }

    #loading-screen .boot-tip {
      min-height: 1.2em;
      flex: 1;
      text-align: start;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #loading-screen .boot-pct {
      direction: ltr;
      color: #ffbe44;
    }

    @keyframes bootArtIn {
      from { opacity: 0; transform: scale(1.04); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* البوستر مفقود؟ لا نترك شاشة بيضاء */
    #loading-screen.no-art {
      background:
        radial-gradient(120% 80% at 50% 0%, #5dbcf0 0%, #2f7fb8 45%, #1b4d24 100%);
    }

    #loading-screen.no-art .boot-art { display: none; }

    @media (prefers-reduced-motion: reduce) {
      #loading-screen .boot-art { animation: none; }
      #loading-screen .boot-fill { transition: none; }
    }
  </style>

  <!-- Three.js Module Importmap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" aria-label="MY FARM 3D"></canvas>

    <!-- Context Interaction Prompt (Purchase Land or Use Axe) -->
    <div id="action-prompt">
      <div class="prompt-info">
        <span class="prompt-title" id="prompt-title">🌾 أرض جديدة</span>
        <span class="prompt-desc" id="prompt-desc">السعر: 💰 100</span>
      </div>
      <button type="button" class="prompt-btn" id="btn-prompt-action">تفاعل</button>
    </div>

    <!-- Purchase Confirmation Modal -->
    <div id="purchase-modal">
      <div class="modal-card">
        <h3>توسعة المزرعة</h3>
        <p>هل ترغب في شراء هذه الأرض لتوسيع حدود مزرعتك؟</p>
        <div class="price-badge">
          <span>💰 100 كوينز</span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-confirm-buy" id="btn-confirm-buy">شراء</button>
          <button type="button" class="btn-cancel-buy" id="btn-cancel-buy">إلغاء</button>
        </div>
      </div>
    </div>

    <!-- Loading Screen — بوستر مزرعتي + تقدّم حقيقي من main.js -->
    <div id="loading-screen" role="status" aria-live="polite" aria-label="جارِ تحميل المزرعة">
      <img class="boot-art" src="./my-farm-loading.jpg" alt="مزرعتي — MY FARM 3D"
           fetchpriority="high" decoding="async"
           onerror="this.closest('#loading-screen').classList.add('no-art')">
      <div class="boot-scrim"></div>
      <div class="boot-panel">
        <h1 class="boot-title">مزرعتي</h1>
        <p class="boot-subtitle">MY FARM 3D</p>
        <div class="boot-track">
          <div class="boot-fill" id="loading-fill"></div>
        </div>
        <div class="boot-meta">
          <span class="boot-tip" id="loading-tip">جارِ تجهيز الحقول…</span>
          <span class="boot-pct" id="loading-pct">8%</span>
        </div>
      </div>
    </div>
  </div>

  <!--
    شاشة التحميل: تقدّم مصعّد صناعيًا حتى يعلن main.js جاهزيته
    (يكتب data-farm-boot على <html> عند كل مرحلة ثم يُخفى الشاشة).
  -->
  <script>
    (function () {
      var fill = document.getElementById('loading-fill');
      var pct = document.getElementById('loading-pct');
      var tip = document.getElementById('loading-tip');
      if (!fill || !pct) return;

      var TIPS = [
        'اسقِ المحصول لينمو أسرع 💧',
        'اضرب الفأس 4 مرات لتجهيز الأرض 🪓',
        'اطحن القمح في الطاحونة ثم اخبزه 🍞',
        'الحصاد يدخل المخزن — البيع يجلب الكوينز 💰',
        'أطعم حيواناتك لتجمع البيض والحليب 🥚',
        'افتح أراضٍ جديدة حول المزرعة 🗺️'
      ];

      var progress = 8;
      var tipIndex = 0;
      var screen = document.getElementById('loading-screen');
      var tick = 0;
      var tips = 0;

      function stop() {
        clearInterval(tick);
        clearInterval(tips);
      }

      function paint(value) {
        fill.style.width = value + '%';
        pct.textContent = Math.round(value) + '%';
      }

      tick = setInterval(function () {
        //main.js يكتب data-farm-boot بالنسب، ويضيف fade-out عند الجاهزية
        var announced = parseInt(document.documentElement.getAttribute('data-farm-boot') || '0', 10);
        var goal = announced > progress ? announced : Math.min(88, progress + 3);
        progress = Math.min(100, progress + Math.max(0.6, (goal - progress) * 0.35));
        paint(progress);

        if (!screen || screen.classList.contains('fade-out')) {
          paint(100);
          stop();
        } else if (progress >= 99.5) {
          paint(100);
          stop();
        }
      }, 140);

      tips = setInterval(function () {
        if (!tip || tipIndex >= TIPS.length * 4) return;
        tipIndex = (tipIndex + 1) % TIPS.length;
        tip.style.opacity = 0;
        setTimeout(function () {
          tip.textContent = TIPS[tipIndex];
          tip.style.transition = 'opacity .3s ease';
          tip.style.opacity = 1;
        }, 160);
      }, 2600);
    })();
  </script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>

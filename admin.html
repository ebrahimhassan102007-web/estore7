<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المنتجات</title>
    <!-- ربط الـ CSS من مجلد css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="padding: 40px; text-align: center;">
    <h1>لوحة التحكم - إضافة منتج جديد</h1>
    <br><br>
    
    <input type="file" id="image">
    <br><br>
    
    <input type="text" id="title" placeholder="اسم المنتج" class="search">
    <br><br>
    
    <input type="number" id="price" placeholder="سعر المنتج" class="search">
    <br><br>
    
    <select id="category" style="padding: 10px; border-radius: 8px;">
        <option value="men">رجالي</option>
        <option value="women">نسائي</option>
        <option value="kids">أطفال</option>
        <option value="offers">عروض</option>
    </select>
    <br><br>
    
    <img id="preview" width="200" style="display: block; margin: 15px auto; border-radius: 10px;">
    
    <button id="add" class="cart">إضافة المنتج</button>

    <hr style="margin: 40px 0; border: 1px solid #ddd;">

    <!-- قسم عرض المنتجات وحذفها في لوحة التحكم -->
    <h2>المنتجات الحالية</h2>
    <div class="products" id="admin-products-container" style="margin-top: 30px;">
        <!-- المنتجات ستظهر هنا مع زر الحذف -->
    </div>

    <!-- ربط الـ JS من مجلد js -->
    <script src="js/admin.js"></script>
</body>
</html>
